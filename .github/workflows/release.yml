name: Release APK
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release tag and signing configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
          for secret in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!secret}" || { echo "::error::Missing signing secret: $secret"; exit 1; }
          done
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/browserrouter.p12"
          chmod 600 "$RUNNER_TEMP/browserrouter.p12"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/browserrouter.p12" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Verify and assemble signed APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Prepare assets
        run: |
          mkdir release
          cp app/build/outputs/apk/release/app-release.apk "release/BrowserRouter-${RELEASE_VERSION}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "release/BrowserRouter-${RELEASE_VERSION}.apk"
          git archive --format=zip --output="release/BrowserRouter-${RELEASE_VERSION}-source.zip" HEAD
          cd release
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "BrowserRouter ${RELEASE_VERSION}"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/browserrouter.p12"
