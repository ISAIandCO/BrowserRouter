name: Release APK
run-name: Release APK ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v1.0.0 (должен совпадать с versionName)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    environment: release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify wrapper JAR
        run: echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Validate release tag and signing configuration
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Select main in Use workflow from for a manual release"
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test "$REQUESTED_TAG" = "v$version" || { echo "::error::Tag must equal v$version"; exit 1; }
          if git show-ref --verify --quiet "refs/tags/$REQUESTED_TAG"; then
            test "$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")" = "$GITHUB_SHA" || {
              echo "::error::Existing tag points to another commit; it will not be overwritten"
              exit 1
            }
          fi
          for secret in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!secret}" || { echo "::error::Missing signing secret: $secret"; exit 1; }
          done
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/browserrouter.p12"
          chmod 600 "$RUNNER_TEMP/browserrouter.p12"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/browserrouter.p12" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
      - name: Verify and assemble signed APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Prepare assets
        run: |
          mkdir release
          cp app/build/outputs/apk/release/app-release.apk "release/BrowserRouter-${RELEASE_VERSION}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "release/BrowserRouter-${RELEASE_VERSION}.apk"
          git archive --format=zip --output="release/BrowserRouter-${RELEASE_VERSION}-source.zip" HEAD
          cd release
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Create release tag if missing
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "BrowserRouter ${RELEASE_VERSION}"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: app/build/reports/
          if-no-files-found: warn
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/browserrouter.p12"
